<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Styles/style_sheet_3.css">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">    
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <title>Order</title>
</head>
<body id="order_body">

    <!-- Navigation Section -->
    <header>
        <Section>
            <div id="mainheading">
                <header class="mainheader">
                    <div id="nav">
                        <nav class="nav">
                            <ul>
                                <img id="nav_logo" src="./img/Logo.png" alt="">
                                <li><a id="li" href="./index.html">HOME</a></li>
                                <li><a id="li" href="./pharmacy.html"><font color="aqua"><u>Pharmacy</u></font></a></li>
                                <li><a id="li" href="./contacts.html">Contacts</a></li>   
                            </ul>    
                        </nav>
                    </div>        
                </header>
            </div>
         </Section>
    </header>

    <!-- -------------------------------------------------------------------------------------------------------------------------------------- -->

    <div class="form-container">

        <h1 id="h1">Online Pharmacy</h1>

        <div class="flexbox">
            <form id="the_form" method="post">

                <!-- Category 1 -->
                <div class="category1">
                    <h1>Analgesics</h1><br>                               
    
                    <select id="c1_medicine" required>
                        <option value="" disabled selected>Select Medicine</option>
                        <option id="medicine1" value="Paracetamol">Paracetamol</option>
                        <option id="medicine2" value="Ibuprofen">Ibuprofen</option>
                        <option id="medicine3" value="Aspirin">Aspirin </option>
                        <option id="medicine4" value="Tramadol">Tramadol </option>
                        <option id="medicine5" value="Morphine">Morphine </option>
                        <option id="medicine6" value="Diclofenac">Diclofenac </option>
                    </select>
                
                    <input id="c1_quantity" type="number" required min="1" placeholder="Quantity">

                    <button id="btn_add_to_cart_1" type="submit">Add to Cart</button>
                </div>

                <!-- Category 2 -->
                <div class="category2">
                    <h1>Antibiotics</h1><br>                               
    
                    <select id="c2_medicine" required>
                        <option value="" disabled selected>Select Medicine</option>
                        <option id="medicine1" value="Amoxicillin">Amoxicillin </option>
                        <option id="medicine2" value="Ciprofloxacin">Ciprofloxacin </option>
                        <option id="medicine3" value="Doxycycline">Doxycycline </option>
                        <option id="medicine4" value="Azithromycin">Azithromycin </option>
                        <option id="medicine5" value="Metronidazole">Metronidazole </option>
                        <option id="medicine6" value="Cephalexin">Cephalexin </option>
                    </select>
                
                    <input id="c2_quantity" type="number" required min="1" placeholder="Quantity">

                    <button id="btn_add_to_cart_2" type="submit">Add to Cart</button>
                </div>

                <!-- Category 3 -->
                <div class="category3">
                    <h1>Antidepressants</h1><br>                               
    
                    <select id="c3_medicine" required>
                        <option value="" disabled selected>Select Medicine</option>
                        <option id="medicine1" value="Fluoxetine (Prozac)">Fluoxetine (Prozac)</option>
                        <option id="medicine2" value="Sertraline (Zoloft)">Sertraline (Zoloft)</option>
                        <option id="medicine3" value="Amitriptyline">Amitriptyline</option>
                        <option id="medicine4" value="Escitalopram (Lexapro)">Escitalopram (Lexapro)</option>
                        <option id="medicine5" value="Duloxetine (Cymbalta)">Duloxetine (Cymbalta)</option>
                        <option id="medicine6" value="Bupropion (Wellbutrin)">Bupropion (Wellbutrin)</option>
                    </select>
                
                    <input id="c3_quantity" type="number" required min="1" placeholder="Quantity">

                    <button id="btn_add_to_cart_3" type="submit">Add to Cart</button>
                </div>

                <!-- Category 4 -->
                <div class="category4">
                    <h1>Antihistamines</h1><br>                               
    
                    <select id="c4_medicine" required>
                        <option value="" disabled selected>Select Medicine</option>
                        <option id="medicine1" value="Loratadine (Claritin)">Loratadine (Claritin)</option>
                        <option id="medicine2" value="Cetirizine (Zyrtec)">Cetirizine (Zyrtec)</option>
                        <option id="medicine3" value="Diphenhydramine (Benadryl)">Diphenhydramine (Benadryl)</option>
                        <option id="medicine4" value="Fexofenadine (Allegra)">Fexofenadine (Allegra)</option>
                        <option id="medicine5" value="Chlorpheniramine">Chlorpheniramine</option>
                        <option id="medicine6" value="Promethazine">Promethazine</option>
                    </select>
                
                    <input id="c4_quantity" type="number" required min="1" placeholder="Quantity">

                    <button id="btn_add_to_cart_4" type="submit">Add to Cart</button>
                </div>

                <!-- Category 5 -->
                <div class="category5">
                    <h1>Antihypertensives</h1><br>                               
    
                    <select id="c5_medicine" required>
                        <option value="" disabled selected>Select Medicine</option>
                        <option id="medicine1" value="Amlodipine">Amlodipine</option>
                        <option id="medicine2" value="Lisinopril">Lisinopril </option>
                        <option id="medicine3" value="Losartan">Losartan </option>
                        <option id="medicine4" value="Hydrochlorothiazide (HCTZ)">Hydrochlorothiazide (HCTZ)</option>
                        <option id="medicine5" value="Metoprolol">Metoprolol </option>
                        <option id="medicine6" value="Clonidine">Clonidine </option>
                    </select>
                
                    <input id="c5_quantity" type="number" required min="1" placeholder="Quantity">

                    <button id="btn_add_to_cart_5" type="submit">Add to Cart</button>
                </div>                
    
            </form>

            <table id="cart" border="2">
                <thead>
                    <tr>
                        <th>Medicine</th>
                        <th>Quantity</th>
                        <th>Price</th>
                    </tr>
                </thead>    
    
                <tbody id="Cart">
                    <tr id="cart_item">
                    </tr>
                </tbody>

                <tfoot >
                    <tr>
                        <td colspan="2">Total</td>
                        <td id="total_price"></td>
                    </tr>
                    <tr>
                        <td>
                            <button id="btn_add_to_favourites">Add to Favourites *</button>
                        </td>
                        <td>
                            <button id="btn_apply_favourites">Apply Favourites *</button>
                        </td>
                    </tr>
                </tfoot>
                    
                
                
                
            </table>

        </div>

        <center><a href="./contacts.html" id="btn_checkout"><button href="./contacts.html" id="btn_checkout" type="submit">Buy Now</button></a></center>

        
        

        
    </div>

    <!-- -------------------------------------------------------------------------------------------------------------------------------------- -->

    <!-- FOOTER WITH NAV LINKS -->

    <section class="footer">
        <footer>

            <ul class="footernav">
                <li><img class="animate-zoom" src="./img/facebook.png" alt="" srcset=""></li>
                <li><img class="animate-zoom" src="./img/instagram.png" alt="" srcset=""></li>
                <li><img class="animate-zoom" src="./img/mail.png" alt="" srcset=""></li>
                <li><img class="animate-zoom" src="./img/whatsapp.png" alt="" srcset=""></li>   
            </ul>

            <div>
                Copyright © 2024 Ashmi Hospital. All rights reserved.
            </div>
        </footer>
    </section>

    <script src="./Scripts/order.js"></script>
    
</body>
</html>
